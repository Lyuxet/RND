services:
  remnanode:
    container_name: remnanode
    hostname: remnanode
    image: remnawave/node:latest
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      - NODE_PORT=2222
      - SECRET_KEY="" 
    volumes:
      - /dev/shm:/dev/shm:rw
      - ./fullchain.pem:/var/lib/remnawave/configs/xray/ssl/cert.pem:ro
      - ./privkey.key:/var/lib/remnawave/configs/xray/ssl/cert.key:ro